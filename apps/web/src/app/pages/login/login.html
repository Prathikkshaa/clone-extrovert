<main class="flex min-h-screen items-center justify-center bg-canvas px-4 text-ink">
  <section class="w-full max-w-sm">
    <a routerLink="/" class="mb-6 flex items-center justify-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-accent text-white">
        <ui-icon name="send" [size]="18" />
      </span>
      <span class="text-heading-sm text-ink">{{ appName }}</span>
    </a>
    <div class="rounded-lg border border-line bg-surface p-8">
      <h1 class="text-heading-md text-ink">Log in</h1>
      <p class="mt-1 text-sm text-muted">Welcome back to {{ appName }}.</p>

      <form (ngSubmit)="submit()" class="mt-6 space-y-4">
        <ui-field label="Email" for="email">
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            class="ui-input"
            [(ngModel)]="email"
          />
        </ui-field>

        <ui-field label="Password" for="password" [error]="error()">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            class="ui-input"
            [(ngModel)]="password"
          />
        </ui-field>

        <button ui-button type="submit" variant="primary" class="w-full" [loading]="loading()">
          Log in
        </button>
      </form>

      <p class="mt-6 text-sm text-muted">
        No account?
        <a routerLink="/signup" class="font-medium text-accent hover:text-accent-strong">Create one</a>
      </p>
    </div>
  </section>
</main>
