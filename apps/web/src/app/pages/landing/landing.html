<main class="flex min-h-screen items-center justify-center bg-canvas px-4 text-ink">
  <section class="w-full max-w-xl text-center">
    <div class="flex items-center justify-center gap-2.5">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-accent text-white">
        <ui-icon name="send" [size]="20" />
      </span>
      <span class="text-heading-sm text-ink">{{ appName }}</span>
    </div>
    <h1 class="mt-6 text-heading-lg text-ink sm:text-4xl sm:leading-tight">
      Reach the right people, in your own voice.
    </h1>
    <p class="mx-auto mt-4 max-w-md text-body text-muted">
      Find leads, write personalized emails, and send them from your own mailbox — calmly and
      on your terms.
    </p>
    <div class="mt-8 flex items-center justify-center gap-3">
      <a routerLink="/signup">
        <button ui-button variant="primary" iconRight="arrow-right">Get started</button>
      </a>
      <a routerLink="/login">
        <button ui-button variant="ghost">Log in</button>
      </a>
    </div>
  </section>
</main>
