<main class="min-h-screen bg-canvas text-ink flex items-center justify-center px-4">
  <section class="w-full max-w-xl text-center">
    <p class="text-sm font-medium uppercase tracking-wide text-muted">
      {{ appName }}
    </p>
    <h1 class="mt-3 text-heading-lg text-ink">
      Reach the right people, in your own voice.
    </h1>
    <p class="mt-4 text-body text-muted">
      Find leads, write personalized emails, and send them from your own mailbox
      — calmly and on your terms.
    </p>
    <div class="mt-8 flex items-center justify-center gap-4">
      <a
        routerLink="/signup"
        class="rounded-md bg-accent px-5 py-3 text-heading-sm text-white transition-colors duration-200 hover:bg-accent-strong focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2"
      >
        Get started
      </a>
      <a routerLink="/login" class="text-heading-sm font-medium text-accent hover:text-accent-strong">
        Log in
      </a>
    </div>
  </section>
</main>
